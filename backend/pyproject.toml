[project]
name = "minifish-backend"
version = "0.1.0"
description = "MiniFish - 长文本 → GraphRAG → Agent 人设 的两步精简 Demo"
requires-python = ">=3.11"
license = { text = "AGPL-3.0" }
authors = [{ name = "MiniFish Team" }]

dependencies = [
    "flask>=3.0.0",
    "flask-cors>=6.0.0",
    "openai>=1.0.0",
    "neo4j>=5.23.0",
    "qdrant-client>=1.9.0",
    "PyMuPDF>=1.24.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
